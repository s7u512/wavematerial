[project]
name = "wavematerial"
version = "0.1.0.dev0"
description = "Local, offline speaker-attributed transcription with an editor."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "GPL-2.0-only WITH Universal-FOSS-exception-1.0"
license-files = ["LICENSE.md", "THIRD_PARTY.md"]
authors = [{ name = "s7u512" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Environment :: Web Environment",
    "Intended Audience :: End Users/Desktop",
    "Natural Language :: English",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
    "av>=19,<20",
    "platformdirs>=4,<5",
    "psutil>=7,<8",
    "sherpa-onnx==2.0.2",
    "tomli-w>=1,<2",
    "transcribe-cpp==0.4.2",
    "transcribe-cpp-native==0.4.2",
]

[project.urls]
Repository = "https://github.com/s7u512/wavematerial"

[project.scripts]
wavematerial = "wavematerial.__main__:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.8"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wavematerial"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["models: needs the real models; skipped by default"]
