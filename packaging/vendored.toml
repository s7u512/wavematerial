# SPDX-License-Identifier: GPL-2.0-only WITH Universal-FOSS-exception-1.0
#
# Native libraries that the bundled wheels carry (their *.libs folders, or linked in
# statically), with the source each was built from.
#
# packaging/bundle.py fails if a vendored library file matches no entry here, or an entry
# matches nothing, so this list stays true when a wheel changes. It copies each entry's
# licence texts into the bundle (the credits page shows them offline). packaging/release.py
# ships the archives marked `source = true` with every release that contains them.
#
# Fields: name, version, licence (SPDX), platforms, files (globs under site-packages; empty
# when linked in statically or not vendored), url, sha256 (of the archive at url; kept in
# dist/cache/vendored/<archive>), source (ship the archive with releases), licence_files
# (paths inside the archive; "outer!inner" reads a file from an archive inside the archive),
# credits (list it on the credits page; false when the package's own metadata covers it).
#
# Sources: PyAV 19.0.2 bundles FFmpeg built by PyAV-Org/pyav-ffmpeg release 9.0.2-1 (commit
# bac889417e26be29615cb6a3f38318151fed55cd), whose scripts/pkg.py pins every source URL and
# sha256 used below. The rest come from the wheels' build images, identified by version
# strings, auditwheel's SBOM, and (libiconv) a byte comparison with MSYS2's builds.

# Folders whose libraries the package's own licence file already covers, with all their
# notices (Pillow's LICENSE lists every library in pillow.libs; numpy's covers OpenBLAS).
covered = ["pillow.libs/*", "numpy.libs/*"]

